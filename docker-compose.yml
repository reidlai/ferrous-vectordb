# ==============================================================================
# FerrousCX Vector Database & Knowledge Seeder Standalone Docker Compose Manifest
# Adheres strictly to Tier 2 DevSecOps standards (UID 10001 rootless, Day-0 hardening)
# ==============================================================================

services:
  vectordb:
    build:
      context: .
      dockerfile: Dockerfile
    image: ferrous-vectordb:latest
    container_name: ferrous-vectordb
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
      - ./qdrant_snapshots:/qdrant/snapshots
      - ./config/config.yaml:/qdrant/config/config.yaml:ro
    environment:
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false

  seeder:
    build:
      context: .
      dockerfile: Dockerfile.seeder
    image: ferrous-vectordb-seeder:latest
    container_name: ferrous-vectordb-seeder
    user: "10001:10001"
    restart: "no"
    environment:
      - QDRANT_HOST=http://vectordb:6333
    depends_on:
      vectordb:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
